name: ORA Recovery

on:
  repository_dispatch:
    types: [ora-recover]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ora-recovery
  cancel-in-progress: true

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out application source
        uses: actions/checkout@v4
        with:
          ref: ora-app
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Requeue interrupted tasks
        working-directory: OpenRuntimeAgent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/cloud-recovery.js
